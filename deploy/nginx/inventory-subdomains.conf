# Nginx: inventory app on qubix-nginx (same VPS as portfolio).
# Paths inside the container match mounts from qubix_solution_portfolio_website:
#   certbot/conf -> /etc/letsencrypt
#   certbot/www  -> /var/www/certbot
#
# Deploy on server (after git pull this repo):
#   sudo cp deploy/nginx/inventory-subdomains.conf \
#     /root/qubix_solution_portfolio_website/nginx/conf.d/inventory.conf
#   docker network connect qubix-solutions_qubix-net qubix-nginx 2>/dev/null || true
#   docker exec qubix-nginx nginx -t && docker exec qubix-nginx nginx -s reload
#
# Prerequisites:
# - Cert for inventory.qubixsolution.com + inventory-api (e.g. certbot certonly ... -d ...)
# - Docker DNS: ims-frontend, ims-backend on network qubix-solutions_qubix-net (IMS compose).

server {
    listen 80;
    server_name inventory.qubixsolution.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name inventory.qubixsolution.com;

    ssl_certificate     /etc/letsencrypt/live/inventory.qubixsolution.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inventory.qubixsolution.com/privkey.pem;

    location / {
        proxy_pass http://ims-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name inventory-api.qubixsolution.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name inventory-api.qubixsolution.com;
    client_max_body_size 25m;

    ssl_certificate     /etc/letsencrypt/live/inventory.qubixsolution.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inventory.qubixsolution.com/privkey.pem;

    location / {
        proxy_pass http://ims-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
