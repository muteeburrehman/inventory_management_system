<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account invitation</title>
</head>
<body style="margin:0;font-family:system-ui,-apple-system,sans-serif;line-height:1.5;background:#f4f4f5;color:#18181b;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:24px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width:480px;background:#fff;border-radius:12px;padding:28px 24px;box-shadow:0 4px 24px rgba(0,0,0,.06);">
          <tr>
            <td>
              <p style="margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#71717a;">{{ app_name }}</p>
              <h1 style="margin:0 0 16px;font-size:20px;font-weight:600;">You're invited</h1>
              <p style="margin:0 0 16px;color:#3f3f46;">Hello {{ user.first_name|default:user.username }},</p>
              <p style="margin:0 0 24px;color:#3f3f46;">Use the button below to set your password. This link expires in <strong>{{ hours_valid }} hours</strong>.</p>
              <p style="margin:0 0 24px;">
                <a href="{{ link }}" style="display:inline-block;padding:12px 20px;background:#0f766e;color:#fff;text-decoration:none;border-radius:8px;font-weight:600;">Set up your account</a>
              </p>
              <p style="margin:0;font-size:13px;color:#71717a;word-break:break-all;">If the button doesn't work, copy this URL:<br><a href="{{ link }}" style="color:#0f766e;">{{ link }}</a></p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
