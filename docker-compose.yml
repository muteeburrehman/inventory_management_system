# Inventory stack: Postgres + Django + React (behind an EXISTING nginx-proxy on this host).
# Use this when ports 80/443 are already taken by another docker-proxy / nginx-proxy
# (e.g. another project). IMS containers only need to join that proxy's Docker network.
#
# Prerequisite: find the network your running proxy uses:
#   docker network ls
#   docker inspect <nginx-proxy-container> --format '{{json .NetworkSettings.Networks}}'
# Set PROXY_NETWORK_NAME in .env (repo root).
#
# Fresh server with nothing on 80/443: use docker-compose.full-stack.yml instead:
#   docker compose -f docker-compose.full-stack.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: ims-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-ims}
      POSTGRES_USER: ${DB_USER:-ims}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - proxy-tier

  redis:
    image: redis:7-alpine
    container_name: ims-redis
    restart: unless-stopped
    networks:
      - proxy-tier

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ims-backend
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ALLOWED_HOSTS: ${API_HOST:?Set API_HOST in .env}
      DB_NAME: ${DB_NAME:-ims}
      DB_USER: ${DB_USER:-ims}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: "5432"
      CORS_ALLOWED_ORIGINS: "https://${FRONTEND_HOST}"
      CSRF_TRUSTED_ORIGINS: "https://${API_HOST},https://${FRONTEND_HOST}"
      SERVE_MEDIA: "true"
      VIRTUAL_HOST: ${API_HOST}
      VIRTUAL_PORT: "8000"
      LETSENCRYPT_HOST: ${API_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-support@qubixsolution.com}
      FRONTEND_BASE_URL: https://${FRONTEND_HOST}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@localhost}
      IMS_APP_NAME: ${IMS_APP_NAME:-Inventory Management System}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - backend_media:/app/media
    restart: unless-stopped
    networks:
      - proxy-tier

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ims-celery
    command: celery -A config worker -l info --concurrency=2
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ALLOWED_HOSTS: ${API_HOST:?Set API_HOST in .env}
      DB_NAME: ${DB_NAME:-ims}
      DB_USER: ${DB_USER:-ims}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: "5432"
      FRONTEND_BASE_URL: https://${FRONTEND_HOST}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@localhost}
      IMS_APP_NAME: ${IMS_APP_NAME:-Inventory Management System}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - proxy-tier

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://${API_HOST}/api/v1
    container_name: ims-frontend
    environment:
      VIRTUAL_HOST: ${FRONTEND_HOST:?Set FRONTEND_HOST in .env}
      LETSENCRYPT_HOST: ${FRONTEND_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-support@qubixsolution.com}
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - proxy-tier

volumes:
  postgres_data:
  backend_media:

networks:
  proxy-tier:
    external: true
    name: ${PROXY_NETWORK_NAME:?Set PROXY_NETWORK_NAME in .env — see header comment}
